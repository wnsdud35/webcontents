<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>도형 서식 폼 만들기</title>
    </head>

    <body>
        <h2>도형 서식 폼 만들기</h2>
        <hr>
        <fieldset>
            <legend>도형 서식 입력</legend>
                <form>
                    선종류 <select name="Korea" size="3">
                        <option value="1">선없음</option>
                        <option value="2" selected>실선</option>
                        <option value="3">점선</option></select>
                </form>

             <br>

                <form>
                    선두께 <input type="number" min="0.0" max="10.0" step="0.5">
        
                    선색<input type="color" value="#00BFFF" onchange="document.body.style.color=this.value">
                </form>

                <br>

                <form>
                    투명도(0~100) : <input type="range" min="0" max="100" list="transparency">
                    <datalist id="transparency">
                        <option value="10" label="low"></option>
                        <option value="50" label="Medium"></option>
                    <option value="100" label="High"></option>
                    </datalist>
                </form>
        </fieldset>
    </body>
</html>
