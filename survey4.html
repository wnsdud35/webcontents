<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>설문지</title>
        <style>
            body {
                background-color: aliceblue;
                margin: 0;
                padding: 20px;
                font-family: "휴먼편지체", "Comic Sans MS", sans-serif;
            }

            h2 {
                color: brown;
                text-align: center;
                font-size: 2em;
                margin-bottom: 10px;
            }

            h3 {
                font-weight: normal;
                margin-bottom: 15px;
            }

            form {
                background-color: pink;
                padding: 20px;
                border-radius: 5px;
            }

            article {
                margin-bottom: 15px;
                display: flex;
                align-items: flex-start;
            }

            .title {
                display: inline-block;
                width: 80px;
                font-weight: bold;
            }

            label {
                margin-right: 10px;
            }

            footer {
                background-color: orange;
                border-radius: 10px;
            }
        </style>
    </head>

    <body>
        <h2>설문지</h2>
        <br>
        <h3>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</h3>
        <hr>
        <section>
            <form>
                <article>
                    <span class="title">학년</span>
                    <label><input type="radio" name="Grade" value="1" checked>1학년</label>
                    <label><input type="radio" name="Grade" value="2">2학년</label>
                    <label><input type="radio" name="Grade" value="3">3학년</label>
                </article>

                <article>
                    <span class="title">성별</span>
                    <label><input type="radio" name="Gender" value="1">남</label>
                    <label><input type="radio" name="Gender" value="2">여</label>
                </article>

                <article>
                    <span class="title">관심 분야</span>
                    <select name="Interset">
                        <option value="1">모바일 소프트웨어</option>
                        <option value="2">게임엔진 개발</option>
                        <option value="3">시스템소프트웨어</option>
                        <option value="4">응용소프트웨어</option>
                    </select>
                </article>

                <article>
                    <span class="title">진로</span>
                    <label><input type="checkbox" name="Career" value="1" checked>개발</label>
                    <label><input type="checkbox" name="Career" value="2">기획</label>
                    <label><input type="checkbox" name="Career" value="3">영업</label>
                    <label><input type="checkbox" name="Career" value="4">창업</label>
                </article>

                <article>
                    <span class="title">남기고 싶은 말</span> <textarea cols="20" rows="5">글을 남겨주세요</textarea><br>
                </article>

                <footer>
                    Copyright 2026 by MYONGJI COLLEGE
                </footer>
            </form>
        </section>
    </body>
</html>
