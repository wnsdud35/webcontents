<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>설문지</title>
    </head>

    <body>
        <h2>설문지</h2>
        <br>
        <h3>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</h3>
        <hr>
        <section>
            <form>
                <article>
                    학년
                        <label><input type="radio" name="Grade" value="1" checked>1학년</label>
                        <label><input type="radio" name="Grade" value="2">2학년</label>
                        <label><input type="radio" name="Grade" value="3">3학년</label>
                </article>

                <br>

                <article>
                    성별
                        <label><input type="radio" name="Gender" value="1">남</label>
                        <label><input type="radio" name="Gender" value="2">여</label>
                </article>

                <br>

                <article>
                    관심 분야
                    <select name="Interset">
                        <option value="1">모바일소프트웨어</option>
                        <option value="2">게임엔진 개발</option>
                        <option value="3">시스템소프트웨어</option>
                        <option value="4">응용소프트웨어</option>
                    </select>
                </article>

                <br>

                <article>
                    진로
                    <input type="checkbox" name="Career" value="1" checked>개발
                    <input type="checkbox" name="Career" value="2">기획
                    <input type="checkbox" name="Career" value="3">영업
                    <input type="checkbox" name="Career" value="4">창업
                </article>

                <br>

                <article>
                    남기고 싶은말 : <textarea cols="20" rows="5">글을 남겨주세요</textarea><br> 
                </article>

                <br>

                Copyright 2026 by JeonJunYeong
            </form>
        </section>
    </body>
</html>
